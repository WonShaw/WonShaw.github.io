<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Code Generator</title>
    <!-- Layout only. All colors, borders and typography come from white-theme.css. -->
    <style>
      header {
        display: flex;
        gap: 16px;
      }

      main {
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }

      .card {
        padding: 16px;
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .card h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .hint {
        margin: 0;
        font-size: 0.9rem;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        padding: 12px;
        font-family: var(--mono);
        font-size: 0.9rem;
        outline: none;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .option > .label {
        min-width: 120px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        font-size: 0.85rem;
        cursor: pointer;
      }

      select {
        padding: 0 8px;
      }

      input[type="color"] {
        width: 36px;
        height: 28px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .preview {
        min-height: 300px;
        padding: 16px;
        display: grid;
        place-items: center;
        border: 1px dashed var(--border);
        border-radius: 10px;
      }

      .preview canvas {
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
        border-radius: 4px;
      }

      .muted,
      .error {
        font-size: 0.85rem;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="white-theme.css" />
  </head>
  <body class="tool-page qrcode-page">
    <nav class="site-nav" aria-label="Site navigation">
      <a class="site-brand" href="index.html">QR Code Generator</a>
      <a class="nav-back" href="index.html">All Tools</a>
    </nav>
    <header>
      <div class="title-block">
        <h1 class="visually-hidden">QR Code Generator</h1>
      </div>
    </header>
    <main>
      <div class="grid">
        <section class="card">
          <h2>Text</h2>
          <p class="hint">Type or paste text or a URL. The QR code updates as you type.</p>
          <textarea id="textInput" placeholder="e.g. https://example.com/ or 你好，世界"></textarea>
          <div class="options">
            <div class="option" id="eclList">
              <span class="label">Error correction</span>
              <label class="chip"><input type="radio" name="ecl" value="L" /> L · 7%</label>
              <label class="chip"><input type="radio" name="ecl" value="M" checked /> M · 15%</label>
              <label class="chip"><input type="radio" name="ecl" value="Q" /> Q · 25%</label>
              <label class="chip"><input type="radio" name="ecl" value="H" /> H · 30%</label>
            </div>
            <div class="option">
              <label class="label" for="sizeSelect">Image size</label>
              <select id="sizeSelect">
                <option value="256">256 px</option>
                <option value="384" selected>384 px</option>
                <option value="512">512 px</option>
                <option value="768">768 px</option>
                <option value="1024">1024 px</option>
              </select>
              <label class="label" for="marginSelect" style="min-width: auto;">Margin</label>
              <select id="marginSelect">
                <option value="0">None</option>
                <option value="2">2 modules</option>
                <option value="4" selected>4 modules</option>
              </select>
            </div>
            <div class="option">
              <span class="label">Colors</span>
              <label class="chip"><input type="color" id="fgColor" value="#000000" /> Foreground</label>
              <label class="chip"><input type="color" id="bgColor" value="#ffffff" /> Background</label>
            </div>
          </div>
          <div class="actions">
            <button id="clearBtn">Clear</button>
          </div>
          <div class="muted" id="textMeta"></div>
          <div class="error" id="errorMsg"></div>
        </section>

        <section class="card">
          <h2>QR Code</h2>
          <p class="hint">Generated locally in your browser; nothing is uploaded.</p>
          <div class="preview">
            <canvas id="qrCanvas" width="0" height="0" hidden></canvas>
            <span class="muted" id="placeholder">Enter some text to generate a QR code.</span>
          </div>
          <div class="actions">
            <button class="primary" id="downloadPngBtn" disabled>Download PNG</button>
            <button id="downloadSvgBtn" disabled>Download SVG</button>
            <button id="copyBtn" disabled>Copy</button>
          </div>
          <div class="muted" id="qrMeta"></div>
        </section>
      </div>
    </main>
    <footer style="padding: 0 24px 28px; color: var(--muted); font-size: 0.8rem; text-align: center;">
      © wonshaw.github.io All rights reserved.
    </footer>

    <script>
      // ---- QR encoder (byte mode, UTF-8, versions 1-40) ----
      const QR = (() => {
        const ECC_PER_BLOCK = {
          L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
          M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
          Q: [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
          H: [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        };
        const NUM_BLOCKS = {
          L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
          M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
          Q: [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
          H: [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
        };
        const FORMAT_BITS = { L: 1, M: 0, Q: 3, H: 2 };

        function numRawDataModules(ver) {
          let result = (16 * ver + 128) * ver + 64;
          if (ver >= 2) {
            const numAlign = Math.floor(ver / 7) + 2;
            result -= (25 * numAlign - 10) * numAlign - 55;
            if (ver >= 7) result -= 36;
          }
          return result;
        }

        function numDataCodewords(ver, ecl) {
          return Math.floor(numRawDataModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
        }

        // Reed-Solomon over GF(2^8) with polynomial 0x11D
        function gfMul(x, y) {
          let z = 0;
          for (let i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11d);
            z ^= ((y >>> i) & 1) * x;
          }
          return z;
        }

        function rsDivisor(degree) {
          const result = new Array(degree).fill(0);
          result[degree - 1] = 1;
          let root = 1;
          for (let i = 0; i < degree; i++) {
            for (let j = 0; j < degree; j++) {
              result[j] = gfMul(result[j], root);
              if (j + 1 < degree) result[j] ^= result[j + 1];
            }
            root = gfMul(root, 2);
          }
          return result;
        }

        function rsRemainder(data, divisor) {
          const result = divisor.map(() => 0);
          for (const b of data) {
            const factor = b ^ result.shift();
            result.push(0);
            divisor.forEach((coef, i) => (result[i] ^= gfMul(coef, factor)));
          }
          return result;
        }

        function addEccAndInterleave(data, ver, ecl) {
          const numBlocks = NUM_BLOCKS[ecl][ver];
          const blockEccLen = ECC_PER_BLOCK[ecl][ver];
          const rawCodewords = Math.floor(numRawDataModules(ver) / 8);
          const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
          const shortBlockLen = Math.floor(rawCodewords / numBlocks);
          const divisor = rsDivisor(blockEccLen);
          const blocks = [];
          for (let i = 0, k = 0; i < numBlocks; i++) {
            const dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
            k += dat.length;
            const ecc = rsRemainder(dat, divisor);
            if (i < numShortBlocks) dat.push(0);
            blocks.push(dat.concat(ecc));
          }
          const result = [];
          for (let i = 0; i < blocks[0].length; i++) {
            blocks.forEach((block, j) => {
              if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) result.push(block[i]);
            });
          }
          return result;
        }

        function alignmentPositions(ver) {
          if (ver === 1) return [];
          const size = ver * 4 + 17;
          const numAlign = Math.floor(ver / 7) + 2;
          const step = ver === 32 ? 26 : Math.ceil((size - 13) / (numAlign * 2 - 2)) * 2;
          const result = [6];
          for (let pos = size - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
          return result;
        }

        const MASKS = [
          (x, y) => (x + y) % 2 === 0,
          (x, y) => y % 2 === 0,
          (x, y) => x % 3 === 0,
          (x, y) => (x + y) % 3 === 0,
          (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
          (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
          (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
          (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
        ];

        function penalty(modules) {
          const size = modules.length;
          let result = 0;
          const lines = [];
          for (let y = 0; y < size; y++) lines.push(modules[y]);
          for (let x = 0; x < size; x++) lines.push(modules.map((row) => row[x]));

          for (const line of lines) {
            // Runs of 5+ same-colored modules
            let run = 1;
            for (let i = 1; i <= size; i++) {
              if (i < size && line[i] === line[i - 1]) {
                run++;
              } else {
                if (run >= 5) result += run - 2;
                run = 1;
              }
            }
            // Finder-like patterns
            const s = line.map((v) => (v ? "1" : "0")).join("");
            for (const pat of ["10111010000", "00001011101"]) {
              for (let idx = s.indexOf(pat); idx !== -1; idx = s.indexOf(pat, idx + 1)) result += 40;
            }
          }

          // 2x2 blocks
          let dark = 0;
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              const c = modules[y][x];
              if (c) dark++;
              if (x + 1 < size && y + 1 < size && c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
                result += 3;
              }
            }
          }

          // Dark/light balance
          const k = Math.ceil(Math.abs(dark * 20 - size * size * 10) / (size * size)) - 1;
          return result + Math.max(k, 0) * 10;
        }

        function encode(text, ecl) {
          const bytes = Array.from(new TextEncoder().encode(text));

          let ver = 1;
          for (; ; ver++) {
            if (ver > 40) throw new RangeError("too long");
            const ccBits = ver < 10 ? 8 : 16;
            if (4 + ccBits + bytes.length * 8 <= numDataCodewords(ver, ecl) * 8) break;
          }

          // Build the data bit stream
          const bits = [];
          const append = (val, len) => {
            for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
          };
          append(4, 4);
          append(bytes.length, ver < 10 ? 8 : 16);
          bytes.forEach((b) => append(b, 8));
          const capacityBits = numDataCodewords(ver, ecl) * 8;
          append(0, Math.min(4, capacityBits - bits.length));
          append(0, (8 - (bits.length % 8)) % 8);
          for (let pad = 0xec; bits.length < capacityBits; pad ^= 0xec ^ 0x11) append(pad, 8);

          const dataCodewords = [];
          for (let i = 0; i < bits.length; i += 8) {
            dataCodewords.push(parseInt(bits.slice(i, i + 8).join(""), 2));
          }
          const codewords = addEccAndInterleave(dataCodewords, ver, ecl);

          // Module grid
          const size = ver * 4 + 17;
          const modules = Array.from({ length: size }, () => new Array(size).fill(false));
          const isFunction = Array.from({ length: size }, () => new Array(size).fill(false));
          const setFn = (x, y, dark) => {
            modules[y][x] = dark;
            isFunction[y][x] = true;
          };

          const drawFormatBits = (mask) => {
            const data = (FORMAT_BITS[ecl] << 3) | mask;
            let rem = data;
            for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const fb = ((data << 10) | rem) ^ 0x5412;
            const bit = (i) => ((fb >>> i) & 1) !== 0;
            for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
            setFn(8, 7, bit(6));
            setFn(8, 8, bit(7));
            setFn(7, 8, bit(8));
            for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
            for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
            for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
            setFn(8, size - 8, true);
          };

          // Timing patterns
          for (let i = 0; i < size; i++) {
            setFn(6, i, i % 2 === 0);
            setFn(i, 6, i % 2 === 0);
          }
          // Finder patterns with separators
          for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
            for (let dy = -4; dy <= 4; dy++) {
              for (let dx = -4; dx <= 4; dx++) {
                const dist = Math.max(Math.abs(dx), Math.abs(dy));
                const x = cx + dx;
                const y = cy + dy;
                if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, dist !== 2 && dist !== 4);
              }
            }
          }
          // Alignment patterns
          const align = alignmentPositions(ver);
          const n = align.length;
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
              for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                  setFn(align[i] + dx, align[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
                }
              }
            }
          }
          drawFormatBits(0);
          // Version information
          if (ver >= 7) {
            let rem = ver;
            for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
            const vb = (ver << 12) | rem;
            for (let i = 0; i < 18; i++) {
              const dark = ((vb >>> i) & 1) !== 0;
              const a = size - 11 + (i % 3);
              const b = Math.floor(i / 3);
              setFn(a, b, dark);
              setFn(b, a, dark);
            }
          }

          // Data and error-correction codewords in zigzag order
          let idx = 0;
          for (let right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (let vert = 0; vert < size; vert++) {
              for (let j = 0; j < 2; j++) {
                const x = right - j;
                const upward = ((right + 1) & 2) === 0;
                const y = upward ? size - 1 - vert : vert;
                if (!isFunction[y][x] && idx < codewords.length * 8) {
                  modules[y][x] = ((codewords[idx >>> 3] >>> (7 - (idx & 7))) & 1) !== 0;
                  idx++;
                }
              }
            }
          }

          // Choose the mask with the lowest penalty
          const applyMask = (mask) => {
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                if (!isFunction[y][x] && MASKS[mask](x, y)) modules[y][x] = !modules[y][x];
              }
            }
          };
          let bestMask = 0;
          let bestPenalty = Infinity;
          for (let mask = 0; mask < 8; mask++) {
            applyMask(mask);
            drawFormatBits(mask);
            const p = penalty(modules);
            if (p < bestPenalty) {
              bestPenalty = p;
              bestMask = mask;
            }
            applyMask(mask);
          }
          applyMask(bestMask);
          drawFormatBits(bestMask);

          return { modules, size, version: ver, mask: bestMask, bytes: bytes.length };
        }

        return { encode };
      })();

      // ---- UI ----
      const textInput = document.getElementById("textInput");
      const sizeSelect = document.getElementById("sizeSelect");
      const marginSelect = document.getElementById("marginSelect");
      const fgColor = document.getElementById("fgColor");
      const bgColor = document.getElementById("bgColor");
      const canvas = document.getElementById("qrCanvas");
      const placeholder = document.getElementById("placeholder");
      const textMeta = document.getElementById("textMeta");
      const qrMeta = document.getElementById("qrMeta");
      const errorMsg = document.getElementById("errorMsg");
      const downloadPngBtn = document.getElementById("downloadPngBtn");
      const downloadSvgBtn = document.getElementById("downloadSvgBtn");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");

      let current = null;

      function getEcl() {
        return document.querySelector("#eclList input[name='ecl']:checked").value;
      }

      function setOutputEnabled(enabled) {
        canvas.hidden = !enabled;
        placeholder.hidden = enabled;
        downloadPngBtn.disabled = !enabled;
        downloadSvgBtn.disabled = !enabled;
        copyBtn.disabled = !enabled;
      }

      function render() {
        const text = textInput.value;
        errorMsg.textContent = "";
        current = null;

        if (!text) {
          textMeta.textContent = "";
          qrMeta.textContent = "";
          setOutputEnabled(false);
          return;
        }

        let qr;
        try {
          qr = QR.encode(text, getEcl());
        } catch (err) {
          textMeta.textContent = "";
          qrMeta.textContent = "";
          errorMsg.textContent =
            "Text is too long for a QR code at this error correction level. Shorten it or pick a lower level.";
          setOutputEnabled(false);
          return;
        }

        const margin = Number(marginSelect.value);
        const total = qr.size + margin * 2;
        const scale = Math.max(1, Math.round(Number(sizeSelect.value) / total));
        const px = total * scale;

        canvas.width = px;
        canvas.height = px;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, px, px);
        ctx.fillStyle = fgColor.value;
        for (let y = 0; y < qr.size; y++) {
          for (let x = 0; x < qr.size; x++) {
            if (qr.modules[y][x]) ctx.fillRect((x + margin) * scale, (y + margin) * scale, scale, scale);
          }
        }

        current = { qr, margin, total };
        setOutputEnabled(true);
        textMeta.textContent = `${text.length} chars · ${qr.bytes} bytes (UTF-8)`;
        qrMeta.textContent = `Version ${qr.version} · ${qr.size}×${qr.size} modules · ${px}×${px} px`;
      }

      function buildSvg() {
        const { qr, margin, total } = current;
        let path = "";
        for (let y = 0; y < qr.size; y++) {
          for (let x = 0; x < qr.size; x++) {
            if (qr.modules[y][x]) path += `M${x + margin},${y + margin}h1v1h-1z`;
          }
        }
        const px = canvas.width;
        return (
          `<?xml version="1.0" encoding="UTF-8"?>\n` +
          `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">` +
          `<rect width="100%" height="100%" fill="${bgColor.value}"/>` +
          `<path d="${path}" fill="${fgColor.value}"/></svg>\n`
        );
      }

      function download(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function showCopyFeedback(button, ok) {
        clearTimeout(button._feedbackTimer);
        button.textContent = ok ? "Copied ✓" : "Copy failed";
        button.classList.toggle("copied", ok);
        button.classList.toggle("copy-failed", !ok);
        button._feedbackTimer = setTimeout(() => {
          button.textContent = "Copy";
          button.classList.remove("copied", "copy-failed");
        }, 1500);
      }

      downloadPngBtn.addEventListener("click", () => {
        if (!current) return;
        canvas.toBlob((blob) => download(blob, "qrcode.png"), "image/png");
      });

      downloadSvgBtn.addEventListener("click", () => {
        if (!current) return;
        download(new Blob([buildSvg()], { type: "image/svg+xml" }), "qrcode.svg");
      });

      copyBtn.addEventListener("click", () => {
        if (!current) return;
        try {
          const blobPromise = new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
          navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })]).then(
            () => showCopyFeedback(copyBtn, true),
            () => showCopyFeedback(copyBtn, false)
          );
        } catch (err) {
          showCopyFeedback(copyBtn, false);
        }
      });

      clearBtn.addEventListener("click", () => {
        textInput.value = "";
        render();
        textInput.focus();
      });

      textInput.addEventListener("input", render);
      [sizeSelect, marginSelect, fgColor, bgColor].forEach((el) => el.addEventListener("input", render));
      document.querySelectorAll("#eclList input").forEach((el) => el.addEventListener("change", render));
    </script>
  </body>
</html>
